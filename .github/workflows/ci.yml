name: Web learning quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} / local rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q -m 'not spark'

  browser:
    name: Offline editor and browser behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/sparktutor/web/static/editor-src/package-lock.json
      - run: node --test tests/web_frontend.test.cjs
      - name: Rebuild the committed offline editor
        working-directory: src/sparktutor/web/static/editor-src
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Check that the shipped editor matches its locked source
        run: git diff --exit-code -- src/sparktutor/web/static/vendor/editor.bundle.js

  distribution:
    name: Source and wheel installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Check course, browser and license resources
        run: python tools/check_distribution.py dist/*.whl dist/*.tar.gz
      - name: Install the wheel instead of the source checkout
        run: python -m pip install dist/*.whl
      - name: Serve the installed wheel without source-path access or npm
        run: python -I tools/smoke_installed_web.py

  spark-courses:
    name: Real Spark / course reference and negative cases
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPARKTUTOR_TEST_SPARK: '1'
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[spark,dev]'
      - run: python -m pytest tests/test_course_execution.py tests/test_join_labs.py -q -m spark

  demo-spark:
    name: Real Spark / isolated diagnosis scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPARKTUTOR_TEST_SPARK: '1'
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[spark,dev]'
      - run: python -m pytest tests/test_demo_scenarios.py -q -m spark

  web-spark:
    name: Real Spark / browser execution and grading
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPARKTUTOR_TEST_SPARK: '1'
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[spark,dev]'
      - run: python -m pytest tests/test_web_execution.py -q -m spark
      - name: Verify the trusted-local CLI and HTTP learning route
        run: python tools/verify_trusted_local.py --output "${{ runner.temp }}/trusted-local-acceptance"

  account-isolated-spark:
    name: Account login / disposable Spark containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Build the same restricted execution image used by accounts
        run: docker build -t sparktutor-executor:4.1.1 containers/executor
      - name: Verify two logged-in accounts, real grading, Join plans and transfer
        run: python tools/verify_account_execution.py --output "${{ runner.temp }}/account-isolated-acceptance" --include-join --include-plan
