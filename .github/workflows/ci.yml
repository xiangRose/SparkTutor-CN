name: Teaching quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest tests -q
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sparktutor-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sparktutor-vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  spark-courses:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPARKTUTOR_TEST_SPARK: '1'
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -e '.[spark,dev]'
      - run: pytest tests/test_course_execution.py -q

  demo-spark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPARKTUTOR_TEST_SPARK: '1'
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -e '.[spark,dev]'
      - run: pytest tests/test_demo_scenarios.py -q -m spark
