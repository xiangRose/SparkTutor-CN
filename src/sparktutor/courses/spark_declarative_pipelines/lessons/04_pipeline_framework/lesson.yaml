    ## 先手算依赖图，再写排序算法

    图使用“节点 → 它依赖的节点”表示：
    `{"gold": ["silver"], "silver": ["bronze"], "bronze": []}`。
    先找没有未完成依赖的 bronze，完成后轮到 silver，再轮到 gold；注册时先后顺序不重要。
    Kahn 算法重复这个过程，若还有节点但找不到可执行的节点，就检查循环依赖。
    本课通过固定字符串 `spark.table("...")` 识别部分依赖；动态拼接表名不在教学检测器的支持范围。

