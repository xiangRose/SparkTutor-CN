    实现 `dependency_order(graph)`。输入是“节点名 → 依赖名列表”的字典。
    返回节点名列表，每个图内节点恰好出现一次，且在依赖之后；不要修改输入。
    重复依赖只计一次，图外依赖视为已准备好的外部输入，不加入排序结果。
