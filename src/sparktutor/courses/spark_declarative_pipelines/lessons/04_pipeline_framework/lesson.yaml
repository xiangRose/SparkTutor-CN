- Class: text
  Id: "10"
  Depth: all
  Output: |
    ## run() 方法

    最后，`run()` 将所有部分串在一起：

    ```python
    def run(self):
        # Build dependency graph
        graph = {}
        for name, func in self._flows.items():
            graph[name] = self._detect_deps(func)

        # Sort
        order = self._topo_sort(graph)

        # Execute
        for name in order:
            df = self._flows[name](self.spark)
            df.createOrReplaceTempView(name)
            print(f"Registered temporary view: {name} ({df.count()} rows)")
    ```

    每一步的结果都注册为一个**临时视图**，这样下游步骤就能用
    `spark.table("step_name")` 引用它。这正是让依赖检测生效的契约。

