    ## 依赖检测

    管道怎么知道 `silver_orders` 依赖 `bronze_orders`？
    我们检查函数源码中是否有对 `spark.table("...")` 的调用：

    ```python
    import inspect, re

    def _detect_deps(self, func):
        source = inspect.getsource(func)
        return re.findall(r'spark\.table\(["\'](\w+)["\']\)', source)
    ```

    如果 `silver_orders` 调用了 `spark.table("bronze_orders")`，
    正则表达式就会找到 `"bronze_orders"` 作为依赖。这是一个简单
    但有效的启发式方法 —— 它之所以有效，是因为我们约定用
    `spark.table()` 从管道步骤中读取数据。
    本练习只支持形如 spark.table("table_name") 的固定字符串调用；
    正则表达式无法可靠处理注释、动态表名或复杂代码。生产框架应使用显式依赖或语法分析。

