    ## 小结

    你现在拥有了一个可复用的 Pipeline 框架，具备：

    - **声明式注册** —— `@pipe.materialized_view()` 按函数名注册步骤
    - **自动依赖检测** —— 正则表达式检查 `spark.table()` 调用
    - **拓扑执行** —— Kahn 算法确保正确顺序
    - **环检测** —— 循环依赖会抛出清晰的错误

    这是后续所有内容的骨架。接下来三课中，你将使用这个框架
    为一条数据管道构建真正的 **bronze**、**silver** 和 **gold** 层。
