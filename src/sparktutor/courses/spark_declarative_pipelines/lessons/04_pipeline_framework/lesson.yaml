    例如 gold → silver → bronze 的依赖链，应返回 bronze、silver、gold；
    gold 与 silver 互相依赖则必须报错，不能返回一份看似成功的部分列表。
    测试还检查重复依赖、多个独立分支、外部依赖和自环；本题不创建 SparkSession。
