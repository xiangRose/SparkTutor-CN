    ## 先不用框架，把三个函数排好顺序

    Bronze 读输入，Silver 读 Bronze，Gold 读 Silver。
    如果直接写 Python，就应先运行 bronze，再运行 silver，最后运行 gold。
    接下来写的框架只是把“注册函数”和“确定顺序”自动组织起来，不会改变这条依赖。

    ```python
    flows = {}
    def register(func):
        flows[func.__name__] = func
        return func
    ```

    `register(my_function)` 保存函数对象，不是立即调用 `my_function()`。
    `@register` 放在函数定义前，是这次注册调用的语法写法；先分清注册和执行，再看类中的版本。

- Class: text
  Id: "2"
  Depth: all
  Output: |
    Python **装饰器**是一个包装另一个函数以增加行为的函数。
    你可能见过 `@property` 或 `@staticmethod`。
    我们将创建一个 `@pipeline.materialized_view()` 装饰器，
    把一个函数注册为管道步骤：

    ```python
    @pipeline.materialized_view()
    def bronze_orders(spark):
        return spark.read.csv("/data/orders.csv", header=True)
    ```

    当管道运行时，它调用 `bronze_orders(spark)` 并将结果保存为
    名为 `bronze_orders` 的临时视图。函数名即表名 —— 这就是
    "声明式"的部分。

