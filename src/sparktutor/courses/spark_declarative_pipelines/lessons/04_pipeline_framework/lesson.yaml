    ## 你将学到什么

    过去三课你学习了创建 SparkSession、转换数据以及读写文件。
    但真实世界的管道有**多个相互依赖的步骤**：bronze 就绪之前
    你无法构建 silver 层，而 gold 又依赖 silver。

    本课你将构建一个教学用的轻量级 **Pipeline 类**（不是官方 SDP），它能：
    1. 用装饰器注册转换函数
    2. 自动检测函数之间的依赖
    3. 使用拓扑排序按正确顺序运行它们

    学完后，你将拥有一个可复用框架，用于接下来三课中构建的
    bronze、silver 和 gold 层。

