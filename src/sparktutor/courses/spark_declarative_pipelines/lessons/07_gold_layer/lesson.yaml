    ## 从 Silver 到 Gold

    你在上一课构建的 silver 层产出一个 DataFrame，带有干净的
    类型、一个计算好的 `total` 列，以及从时间戳提取出的
    `order_hour`。Gold 读取 silver 的输出，回答类似这样的
    业务问题：

    - "每个产品的总收入是多少？"
    - "每小时有多少订单？"
    - "哪个产品贡献的收入最多？"

    模式永远是：**group → aggregate → （可选）rank 或 sort**。

- Class: text
  Id: "3"
  Depth: beginner
  Output: |
    gold 层的主力是 `groupBy().agg()`：

    ```python
    from pyspark.sql import functions as f

    gold = (silver
        .groupBy("product")
        .agg(
            f.count("*").alias("order_count"),
            f.sum("total").alias("revenue"),
            f.avg("total").alias("avg_order_value"),
        )
    )
    ```

    `groupBy("product")` 为每个唯一的 product 值创建一个组。
    然后 `agg()` 在每个组内计算一个或多个聚合表达式。
    `alias()` 给每个结果列一个有意义的名字 —— 没有它，
    Spark 会生成像 `sum(total)` 这样的名字，下游很难使用。

- Class: text
  Id: "4"
  Depth: all
  Output: |
    ## 常用聚合函数

    这些是你在 `agg()` 中最常用的函数：

    | 函数                    | 说明                  |
    |-------------------------|-----------------------|
    | `f.count("*")`          | 行数                  |
    | `f.sum("col")`          | 值的求和              |
    | `f.avg("col")`          | 平均值                |
    | `f.min("col")`          | 最小值                |
    | `f.max("col")`          | 最大值                |
    | `f.countDistinct("c")`  | 唯一值的数量          |

    你可以把多个表达式传给 `agg()` —— Spark 在一次数据扫描中
    把它们全部算出来。

    **文档：**
    [f.sum](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.functions.sum.html) |
    [f.avg](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.functions.avg.html) |
    [f.count](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.functions.count.html) |
    [f.countDistinct](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.functions.countDistinct.html) |
    [Column.alias](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.Column.alias.html)

