    ## 小结

    你的 gold 层产出干净、经过聚合、可直接用于业务的数据：

    - **groupBy + agg** —— 汇总的核心模式
    - **聚合函数** —— count、sum、avg、min、max、countDistinct
    - **alias()** —— 给计算出的列起有意义的名字
    - **窗口函数** —— 累计求和、排名、移动平均
    - **两阶段聚合** —— 处理热点键的数据倾斜

    你现在已经拥有 medallion 架构的全部三层。在最后一课中，
    你将把它们连接成一条**端到端的完整管道**，并加上错误
    处理和部署模式。
