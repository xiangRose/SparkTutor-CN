- Class: text
  Id: "9"
  Depth: all
  Output: |
    ## 窗口函数：不坍缩行的聚合

    `groupBy` 会坍缩行 —— 每个组输出一行。**窗口函数**
    在相关行之间计算值，同时保留每一行在输出中。这使它们
    非常适合：

    - **累计求和** —— 到当前行为止的累计总和
    - **排名** —— 按收入给产品排名
    - **移动平均** —— 在滑动行窗口上取平均

    ```python
    from pyspark.sql import Window

    w = Window.partitionBy("product").orderBy("order_date").rowsBetween(
        Window.unboundedPreceding, Window.currentRow
    )

    df = df.withColumn("running_revenue", f.sum("total").over(w))
    ```

    `partitionBy` 定义分组（像 groupBy，但行不坍缩）。
    `orderBy` 定义组内行的排序。`rowsBetween` 定义相对于
    当前行在计算中包含哪些行。

    **文档：**
    [Window](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.Window.html) —— `partitionBy()`、`orderBy()`、`rowsBetween()`、`rangeBetween()` |
    [f.rank](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.functions.rank.html) |
    [f.dense_rank](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.functions.dense_rank.html) |
    [f.row_number](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.functions.row_number.html)

