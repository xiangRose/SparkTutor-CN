course:
  id: spark_declarative_pipelines
  title: "Spark 4.1 教学管道：自制框架与分层处理"
  description: "先写普通转换函数，再学习注册与依赖编排，逐层完成 Bronze-Silver-Gold 本地教学管道；不等同于官方 SDP 或生产调度系统"
  version: "1.2.0"
  requires_lakehouse: false
  prerequisites:
    - "先完成 Learning Spark 前三课，或已会创建会话、定义 Schema、筛选、聚合与文件读写"
    - "熟悉 Python 函数、返回值、字典和类；装饰器与拓扑排序从小例子讲起"
    - "服务端准备 Python 3.10+、Java 17/21 与 PySpark 4.1.1；综合题不需要 Docker、Kafka 或 Iceberg"
    - "可选拓展：Iceberg catalog 和完整 Lakehouse Stack 需另配连接器与基础设施，不影响本地核心练习"
  lessons:
    - 01_spark_session
    - 02_functions_and_transforms
    - 03_reading_writing_data
    - 04_pipeline_framework
    - 05_bronze_layer
    - 06_silver_layer
    - 07_gold_layer
    - 08_full_pipeline
