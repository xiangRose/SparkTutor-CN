course:
  id: learning_spark
  title: "Learning Spark：从入门到独立分析"
  description: "面向会基础 Python 的 Spark 初学者：先看小数据、逐项练习，再完成 DataFrame 与 SQL 分析；流处理、湖仓与机器学习按需拓展"
  version: "1.2.0"
  requires_lakehouse: false
  prerequisites:
    - "学习基础：会 Python 的变量、函数、列表、元组、字典与 import；不要求先会 Spark 或 SQL"
    - "运行环境：服务端使用 Python 3.10+、Java 17/21 和 PySpark 4.1.1；使用已有网页服务时无需在学生设备上重复安装"
    - "先在环境设置确认可执行 Spark；仅语法检查可以阅读和做部分题目，不能通过需要运行的编程题"
  lessons:
    - 01_getting_started
    - 02_dataframes_schemas
    - 03_data_sources
    - 04_external_sources_hof
    - 05_spark_sql_deep_dive
    - 06_optimization_tuning
    - 07_join_strategies
    - 08_structured_streaming
    - 09_data_lakes
    - 10_mllib
    - 11_diagnosis_practice
