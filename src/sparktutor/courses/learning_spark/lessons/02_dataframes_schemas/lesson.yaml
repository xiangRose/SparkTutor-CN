    时间包含阅读、编码和调试，可分几次完成；遇到困难先回看对应小节，再使用提示。

- Class: text
  Id: "2"
  Depth: all
  Output: |
    ## DataFrame：分布式表

    DataFrame 是组织成具名、类型化列的分布式数据集合 —— 就像关系数据库中的表。
    两个关键属性：

    1. **不可变（Immutable）** —— 每次转换都返回一个*新的* DataFrame。
       原始 DataFrame 永不修改。这使得 Spark 程序可以安全地并行化。
    2. **惰性（Lazy）** —— 转换会构建一个逻辑计划。在你调用
       `show()`、`count()` 或 `collect()` 等 action 之前，什么都不会执行。

    在底层，DataFrame 跟踪一个 **schema**（列名和类型）和一个
    **逻辑计划**（产生它的转换链）。

- Class: text
  Id: "3"
  Depth: beginner
  Output: |
    ## 类比：把 DataFrame 想象成电子表格

    把 DataFrame 想象成电子表格。每列有名称和类型（文本、数字、日期）。
    你不能原地修改单元格 —— 而是创建一个应用了更改的新工作表。

    - `filter()` —— 高亮匹配条件的行，复制到新工作表
    - `withColumn()` —— 添加一列由已有列计算出的新列
    - `select()` —— 只选取你需要的列
    - `drop()` —— 移除一列

    原始工作表从不被触碰。这种"写时复制"（copy-on-write）方法正是
    Spark 能同时在数百台机器上安全运行的原因。

- Class: text
  Id: "4"
  Depth: all
  Output: |
    ## 常用 DataFrame 操作

    以下是你最常用的转换：

    **选取列：**
    ```python
    df.select("First", "Last", "Hits")
    ```

    **过滤行：**
    ```python
    from pyspark.sql.functions import col
    df.filter(col("Hits") > 10000)
    ```

    **添加或替换列：**
    ```python
    df.withColumn("Double_Hits", col("Hits") * 2)
    ```

    **移除列：**
    ```python
    df.drop("Url")
    ```

    **重命名列：**
    ```python
    df.withColumnRenamed("First", "FirstName")
    ```

    所有这些都返回新的 DataFrame。它们是转换（惰性的）——
    在你调用 action 之前什么都不会执行。

    **文档：**
    [select](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.select.html) |
    [filter](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.filter.html) |
    [withColumn](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.withColumn.html) |
    [drop](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.drop.html)

