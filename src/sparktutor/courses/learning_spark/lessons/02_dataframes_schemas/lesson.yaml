- Class: text
  Id: "13"
  Depth: advanced
  Output: |
    ## 列表达式的底层原理

    `col()` 和 `expr()` 都产生 Column 对象，但它们在 Spark 中走不同的路径：

    - `col("name")` 直接创建一个 **UnresolvedAttribute** 引用。
    - `expr("name * 2")` 经过 Spark 的 SQL 解析器，生成一棵支持算术运算、
      函数调用、CASE/WHEN 和嵌套字段访问的表达式树。

    因为 Column 对象是惰性的，链式调用如下转换：

    ```python
    df.select(col("a") + col("b")).filter(col("c") > 10)
    ```

    会构建一个 **逻辑计划**。Spark 的 Catalyst 优化器随后重写这个计划
    —— 谓词下推、裁剪未使用的列、常量折叠 —— 然后才生成物理执行计划。

    显式定义 schema 有助于优化器：它知道精确的类型，
    可以选择更高效的操作（整数比较 vs. 字符串比较）。

