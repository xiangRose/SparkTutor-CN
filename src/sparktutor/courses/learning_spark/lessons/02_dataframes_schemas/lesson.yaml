- Class: text
  Id: "15"
  Depth: all
  Output: |
    ## 小结

    本课你学到了：

    - **DataFrame** 是不可变的、分布式的表，具有具名、类型化的列 ——
      每次转换都返回新的 DataFrame
    - **核心操作** —— `select`、`filter`、`withColumn`、`drop` 和
      `withColumnRenamed` 是你的日常工具
    - **列表达式** —— `col()`、`df["col"]` 和 `expr()` 都产生惰性
      Column 对象；`expr()` 支持完整的 SQL 语法
    - **Schema** —— `StructType` 和 `StructField` 定义结构；
      生产环境中显式 schema 优于推断
    - **复杂类型** —— `ArrayType`、`MapType` 和嵌套 `StructType`
      处理现实中的嵌套数据
    - **createDataFrame** —— 从 Python 列表或 Row 对象构建 DataFrame

    接下来，你将学习如何以多种格式读写数据 —— CSV、JSON、Parquet 和
    ORC —— 并理解何时使用每种格式。
