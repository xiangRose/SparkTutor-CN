  Depth: all
  Output: |
    ## 从 Python 数据创建 DataFrame

    先用完整的三列小例子，将 Schema 与每行的字段顺序对应起来：

    ```python
    from pyspark.sql.types import StructType, StructField, IntegerType, StringType

    schema = StructType([
        StructField("id", IntegerType(), False),
        StructField("name", StringType(), False),
        StructField("age", IntegerType(), True),
    ])
    data = [(1, "Alice", 30), (2, "Bob", 25)]
    people = spark.createDataFrame(data, schema)
    people.printSchema()
    people.show()
    ```

    每行第一项对应 id，第二项对应 name，第三项对应 age。不要复用上一题 name、age、email 的 Schema 来装这份数据。
    接下来博客综合题会换成七列 DATA：仍然先核对字段顺序与类型，再创建 DataFrame，最后增加布尔列。

