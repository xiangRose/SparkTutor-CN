    ## Schema 推断与显式声明

    读取 CSV、JSON 时，inferSchema 要检查数据内容以推断类型，可能增加读取与解析工作。
    稳定的数据接口优先显式定义 Schema，避免某批数据改变推断结果；探索阶段可以先推断，再检查。
    显式声明类型不等于所有坏数据都立即报错：解析失败如何处理，还取决于读取模式、格式和后续转换设置。
    如果读取后出现 null，要回查原始值，而不是把“有 Schema”当成数据质量已经合格。
    Parquet、ORC 的文件元数据保存 Schema，不需要像 CSV 那样按文本内容推断，但读取元数据仍有成本。

- Class: text
