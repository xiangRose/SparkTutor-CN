- Class: text
  Id: "7"
  Depth: all
  Output: |
    ## 用 StructType 定义 Schema

    schema 描述 DataFrame 的结构：列名、数据类型和可空性。
    你用 `StructType` 和 `StructField` 来定义：

    ```python
    from pyspark.sql.types import *

    schema = StructType([
        StructField("Id", IntegerType(), False),       # 不可为空
        StructField("First", StringType(), False),
        StructField("Last", StringType(), False),
        StructField("Hits", IntegerType(), False),
        StructField("Campaigns", ArrayType(StringType()), False),
    ])
    ```

    每个 `StructField` 接受三个参数：**名称**、**类型**、**是否可空**。

    常用类型：`StringType`、`IntegerType`、`LongType`、`DoubleType`、
    `BooleanType`、`TimestampType`、`DateType`。

    复杂类型：`ArrayType(elementType)`、`MapType(keyType, valueType)`，
    以及用于结构体嵌套结构体的嵌套 `StructType`。

    **文档：**
    [StructType](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.types.StructType.html) |
    [ArrayType](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.types.ArrayType.html) |
    [MapType](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.types.MapType.html)
    —— 用 `StructField(name, type, nullable)` 定义 schema。

