- Class: text
  Id: "17"
  Depth: all
  Output: |
    ## 小结

    本课你学到了：

    - **DataFrameReader** —— 读取任意格式的通用 API
    - **Parquet** —— Spark 的首选列式格式，支持列裁剪、压缩和内嵌 schema
    - **CSV** 和 **JSON** —— 常见的交换格式，有更多选项可配置
    - **DataFrameWriter** —— 写入模式（error、overwrite、append、ignore）
    - **SQL 视图** —— `createOrReplaceTempView` 让你用标准 SQL
      查询 DataFrame
    - **分区** —— 按列值组织输出以实现高效过滤

    你现在可以从任何常见格式读取数据、转换并写入结果。在下一课中，
    你将处理复杂数据类型 —— 数组、映射和嵌套结构体 —— 以及操作它们的
    高阶函数。
