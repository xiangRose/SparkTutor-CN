- Class: text
  Id: "15"
  Depth: advanced
  Output: |
    ## 格式对比：何时用什么

    | 格式 | 存储 | Schema | 压缩 | 最适合 |
    |--------|---------|--------|-------------|----------|
    | Parquet | 列式 | 内嵌 | 极佳 | 分析、数据湖 |
    | ORC | 列式 | 内嵌 | 极佳 | Hive 生态 |
    | CSV | 行式 | 外部 | 默认无 | 交换、调试 |
    | JSON | 行式 | 自描述 | 中等 | API、半结构化 |
    | Avro | 行式 | 内嵌 | 良好 | 流式、Kafka |

    对于分析型文件存储，可优先考虑 **Parquet**；CSV/JSON 常用于数据交换和
    摄入。格式选择还取决于下游系统；使用 Kafka 不代表必须选择 Avro。

    **过滤下推与数据跳读是两回事**：Parquet/ORC 可利用文件内部统计信息，
    在适用条件下跳过不可能匹配的行组或条带，减少读取量。
    Spark 4.1.1 的 CSV/JSON 读取器也支持部分过滤条件下推，默认启用；
    但这不等于拥有相同的行组统计跳读能力，通常仍需扫描文本输入。
    是否下推及跳读多少，取决于谓词、数据布局与配置，不能仅凭格式名称判断。
    可对照 [官方配置](https://spark.apache.org/docs/4.1.1/configuration.html) 中的
    `spark.sql.csv.filterPushdown.enabled` 和 `spark.sql.json.filterPushdown.enabled`。

- Class: text
  Id: io-roundtrip-example
  Depth: all
  Output: |
    ## 把读写过程拆成四步

    1. `df.write.mode("overwrite").parquet(output_path)`：写出题目指定的小表。
    2. `loaded = spark.read.parquet(output_path)`：从磁盘重新读回，确认文件真的存在。
    3. `loaded.createOrReplaceTempView("flights")`：给当前会话中的查询起名，不会再复制一份数据文件。
    4. 用 SQL 的 `GROUP BY destination`、`SUM(delay)`、`ORDER BY total_delay DESC LIMIT 3` 回答问题。

    每步先查看少量行，再串联。临时视图与磁盘目录是两种不同对象。
    同一个输出路径重跑时，练习使用 overwrite；真实业务应先确认覆盖范围。

