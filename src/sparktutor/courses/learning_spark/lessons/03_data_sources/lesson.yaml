- Class: text
  Id: "8"
  Depth: intermediate
  Output: |
    ## ORC 与 Avro

    **ORC**（Optimized Row Columnar）与 Parquet 类似 —— 列式、压缩、
    内嵌 schema。它在 Hive 生态中历史上更受青睐。对于大多数 Spark
    工作负载，Parquet 和 ORC 性能相当。

    **Avro** 是一种**行式**格式，更适合写密集型工作负载和 schema 演进。
    它通常用作 Kafka 的序列化格式。用以下方式读取：

    ```python
    df = spark.read.format("avro").load("/data/events.avro")
    ```

    **经验法则**：分析（读密集）用 Parquet，流式和消息（写密集且需
    schema 演进）用 Avro。

- Class: text
  Id: "9"
  Depth: all
  Output: |
    ## DataFrameWriter API

    写入遵循与读取类似的模式：

    ```python
    df.write.format("parquet").mode("overwrite").save("/output/data")
    ```

    或者使用简写：`df.write.parquet("/output/data")`。

    **写入模式**控制输出路径已存在时的行为：

    | 模式 | 行为 |
    |------|------|
    | `error`（默认） | 如果数据已存在则报错 |
    | `overwrite` | 删除已有数据，写入新数据 |
    | `append` | 在已有数据旁追加新数据 |
    | `ignore` | 如果数据已存在则静默跳过 |

    全量重建可用 `overwrite`，增量追加可用 `append`；
    根据数据保留和重试去重策略选择，写入模式不由开发/生产环境单独决定。

- Class: text
  Id: '11'
  Depth: all
  Output: |
    ## SQL 视图：用 SQL 查询 DataFrame

    一旦创建了视图，就可以用标准 SQL 查询它：

    ```python
    df.createOrReplaceTempView("flights")

    result = spark.sql("""
        SELECT destination, SUM(delay) AS total_delay
        FROM flights
        GROUP BY destination
        ORDER BY total_delay DESC
    """)
    ```

    会话级视图（`createOrReplaceTempView`）仅在当前 SparkSession 内可见。
    如需应用级可见性，使用 `createOrReplaceGlobalTempView` 并通过
    `global_temp.view_name` 访问。

    语义等价的 SQL 与 DataFrame 查询可以交给同一个 Catalyst 引擎优化。
    先核对结果，再比较计划结构；不要求计划文本逐字相同。

