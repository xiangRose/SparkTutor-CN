- Class: text
  Id: "13"
  Depth: intermediate
  Output: |
    ## 写入分区

    分区按列值将输出文件组织到子目录中：

    ```python
    df.write.partitionBy("year", "month").parquet("/output/data")
    ```

    这会创建如下目录结构：
    ```
    /output/data/year=2025/month=01/part-00000.parquet
    /output/data/year=2025/month=02/part-00000.parquet
    /output/data/year=2024/month=12/part-00000.parquet
    ```

    **分区裁剪（Partition pruning）** —— 当你对分区列做过滤时，
    Spark 会跳过不可能匹配的整个目录。查询 `year = 2025` 永远不会
    触碰 `year=2024` 目录。

    **警告**：不要按高基数列（例如用户 ID）分区。你会创建数百万个
    小文件，这对性能的伤害大于帮助。

