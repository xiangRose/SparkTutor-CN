    ## CSV：人类可读但效率低

    CSV 是最常见的交换格式，但它有缺点：没有类型信息、默认不压缩，
    而且即使你只需要一列，Spark 也必须读取所有列。

    读取 CSV 时的关键选项：

    ```python
    df = (spark.read
        .option("header", "true")       # 第一行是列名
        .option("inferSchema", "true")   # 自动检测类型（慢！）
        .option("sep", ",")              # 字段分隔符
        .option("nullValue", "NA")       # 将 "NA" 视为 null
        .option("quote", '"')            # 引号字符
        .csv("/data/orders.csv"))
    ```

    对于生产环境，用你用 `StructType` 定义的显式 schema 替换
    `inferSchema`（来自上一课）。

- Class: text
  Id: "4"
  Depth: all
  Output: |
    ## Parquet：Spark 的首选格式

    **Parquet** 是一种列式存储格式。它不像 CSV 那样把行存在一起，
    而是把每一列存在一起。这带来三个优势：

    1. **列裁剪（Column pruning）** —— 如果你的查询只需要 50 列中的 3 列，
       Spark 只读那 3 列。CSV 则会读取全部 50 列。
    2. **高效压缩** —— 同一列中的相似值比一行中混合的值压缩得更好。
    3. **内嵌 schema** —— 列名和类型存储在文件中，因此不需要 schema
       推断或表头解析。

    Parquet 还支持**谓词下推（predicate pushdown）**：如果你对某列做过滤，
    Spark 可以跳过元数据显示不可能匹配过滤条件的整个行组。

    ```python
    # 读取 Parquet —— 不需要选项，schema 在文件中
    df = spark.read.parquet("/data/flights.parquet")

    # 写入 Parquet
    df.write.parquet("/output/flights")
    ```

- Class: text
  Id: "6"
  Depth: all
  Output: |
    ## JSON：半结构化数据

    Spark 默认读取**单行 JSON** —— 每行一个 JSON 对象
    （也称为 JSON Lines 或 NDJSON）：

    ```json
    {"name": "Alice", "age": 30}
    {"name": "Bob", "age": 25}
    ```

    对于多行 JSON（一个大数组），设置 `multiLine=True`：

    ```python
    df = spark.read.option("multiLine", "true").json("/data/users.json")
    ```

    JSON 自然地处理嵌套数据 —— Spark 将嵌套对象映射为
    `StructType`，将数组映射为 `ArrayType`。

