    ## Sort Merge Join（SMJ）

    排序合并是大表等值关联的常见策略之一：按键分布数据、在分区内排序，再合并匹配行。
    如果数据已有适用的分布或排序，部分重分布与排序工作可能省略；不一定每次都重新跨网络搬全部数据。
    Spark 还可能根据条件采用哈希关联等策略，并可能通过 AQE 在运行中调整。
    在物理计划中查找 SortMergeJoin，结合实际读写和 shuffle 指标解释成本。

