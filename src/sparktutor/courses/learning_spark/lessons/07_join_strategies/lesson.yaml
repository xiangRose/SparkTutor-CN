- Class: text
  Id: "11"
  Depth: advanced
  Output: |
    ## 处理 Join 中的数据倾斜

    当某个 join 键的行数远多于其他键时就会发生数据倾斜 ——
    单个分区成为瓶颈，而其他分区很快完成。常见原因：null 键、
    热门用户、默认类别。

    **解决方案 1：AQE 倾斜 Join**（Spark 3.2+ 自动启用）
    AQE 在运行时检测倾斜的分区，并将其拆分成更小的子分区。
    用以下配置启用：
    ```python
    spark.conf.set("spark.sql.adaptive.skewJoin.enabled", "true")
    spark.conf.set("spark.sql.adaptive.skewJoin.skewedPartitionFactor", "5")
    ```

    **解决方案 2：加盐（Salting）的双表思路** —— 以下仅解释非空键的
    inner join，不是可以直接套用到外连接的完整实现：

    1. 大表中同一热点键的各行分配不同盐值，例如 0、1。
    2. 小表中该键的每一行都复制为盐值 0、1 两份；不能让两表各自随机加盐。
    3. 按原键和盐值同时 inner join，输出时去掉辅助盐列，保留原业务列与重复记录。
    4. 与未加盐的结果比较行数和内容，确认没有丢失或增加匹配，再比较运行代价。

    例如大表键 A 有三行，盐为 0、1、0；小表键 A 只有一行，复制为 A/0、A/1。
    关联后仍有三行。若小表也随机只选一个盐，另一盐的匹配会丢失。
    复制会增大另一侧数据；仅在适合的热点键和表规模下考虑，不保证一定更快。

    **解决方案 3：先明确 null 的业务语义** —— 普通等值 inner join 不匹配 null 键；
    外连接和 null-safe 等值关联的保留规则不同，不能直接丢弃 null 行或照搬上述加盐步骤。

