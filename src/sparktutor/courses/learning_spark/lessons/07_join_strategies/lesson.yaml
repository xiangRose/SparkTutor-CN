  Output: |
    ## 先在纸上关联两张表

    订单有 product_id=1、2；产品表只有 product_id=1，对应名称 pen。
    inner join 只留下匹配到产品 1 的订单；left join 保留两条订单，产品 2 的名称为 null。
    `orders.join(products, "product_id", "left")` 表示按同名键做左关联。
    如果产品表同一个键有两行，一条订单可能匹配出两行；关联前要理解键是否唯一。
    Join 类型决定保留什么行，执行策略决定引擎怎样算，两者不要混为一谈。

