- Class: text
  Id: '4'
  Depth: all
  Output: |
    ## Broadcast Hash Join（BHJ）

    对适合的等值关联，如果一侧足够小，Spark 可以把它广播给执行器，减少大表为关联进行的 shuffle。
    自动广播阈值 `spark.sql.autoBroadcastJoinThreshold` 默认是 10MB，但还要结合统计信息、关联类型等条件选择。
    小于阈值是一个候选条件，不是所有查询一定使用 BHJ 的保证。

    ```python
    from pyspark.sql import functions as f
    result = large_df.join(f.broadcast(small_df), "key")
    result.explain()
    ```

    `broadcast` 提示优化器优先考虑广播；必须评估小表是否适合每个执行器的内存。
    不要仅凭行数少或名称叫 small 就广播。实际策略用 explain 中的算子确认。
    **文档：** [广播与策略提示](https://spark.apache.org/docs/4.1.1/sql-performance-tuning.html)。

