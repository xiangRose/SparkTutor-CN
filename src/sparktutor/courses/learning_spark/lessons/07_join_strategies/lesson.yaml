  Output: |
    ## Bucket 表

    如果两张表经常在同一个键上 join，可评估保存为 **bucketed** 表。
    `bucketBy` 按指定列的哈希组织数据，`sortBy` 则指定桶内排序。
    优化器识别出兼容的桶分布、关联条件和执行策略时，部分 join 可能减少或省去 shuffle：

    ```python
    # Write bucketed
    (orders_df.write
        .bucketBy(8, "user_id")
        .sortBy("user_id")
        .saveAsTable("orders_bucketed"))

    (users_df.write
        .bucketBy(8, "user_id")
        .sortBy("user_id")
        .saveAsTable("users_bucketed"))

    # 是否省去 shuffle，要检查本次实际执行计划。
    orders = spark.table("orders_bucketed")
    users = spark.table("users_bucketed")
    result = orders.join(users, "user_id")
    result.explain()
    ```

    示例使用相同的桶列与桶数，但这本身不保证省去 shuffle。
    还要检查读取计划是否保留了可用的桶分布，以及 join 键和实际策略是否兼容。
    特定配置也支持合并兼容的不同桶数，不能把“桶数相同”当作所有情况的必要条件。
    用 `explain` 查找本次计划中的 `Exchange`，并结合实际执行确认。

