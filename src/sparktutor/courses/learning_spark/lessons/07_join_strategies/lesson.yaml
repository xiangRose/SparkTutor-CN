    ## 小结：先保证关联结果，再讨论策略

    inner/left 等类型决定保留哪些行；重复键可能让结果行数增加。
    广播、排序合并等策略决定引擎怎样执行，不应改变同一查询的业务结果。
    是否广播取决于统计信息、关联条件和资源；hints 也需要通过计划验证。
