    ## 你将学到什么

    关联先解决业务问题：用共同的键把订单和产品、用户和事件对应起来。
    本课先理解 inner、left 等关联类型及重复键对行数的影响，再看 Spark 怎样执行等值关联。
    完成后能写普通关联、为适合的小表提出广播建议，并核对不同策略的结果与计划。
    Bucket 与数据倾斜处理作为拓展；实际策略和收益需要结合统计信息、资源及执行计划判断。

