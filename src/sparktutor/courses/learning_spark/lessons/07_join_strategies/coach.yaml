schemaVersion: coach-catalog-v1
tasks:
- stepId: '13'
  topic: join
  contract: join_comparison(spark) 在同一数据上得到内容相同的两份 inner join 结果及计划；分别验证 BroadcastHashJoin 与 SortMergeJoin，不改变全局广播阈值。
  knowledgeComponents:
  - dataframe.join
  - spark.broadcast
  validation:
    kind: course_tests
    guidance: 修改后提交当前练习，使用课程保留的原始断言验证；运行成功、小样例或模型判断不能代替课程通过。
  hypotheses:
    join_result_contract:
      summary: 可能需要先核对连接键、保留列与两份结果是否相同
      evidenceRequirements:
        anyOf:
        - task
        - event
      levels:
      - question: 改变连接策略后，哪些结果应该保持不变？
        guidance: 先检查连接键、行数和列，再解释物理计划差异。
        reflection: 策略不同不应被用来掩盖结果内容不一致。
      - question: 能否找一条用户或订单，核对其连接前后的对应关系？
        guidance: 只选一条事实记录，核查两份结果中的字段值和匹配情况。
        reflection: 行数相同仍可能匹配到了错误的键或列。
      - question: 两份结果的行内容是否都能对应原始事实记录？
        guidance: 比较内容而不是最终行顺序，并检查题目要求的保留列。
        reflection: 小表验证正确性，不凭单次耗时声称性能优化。
    join_plan_mismatch:
      summary: 实际执行计划可能没有采用题目要求的连接策略
      evidenceRequirements:
        anyOf:
        - task
        - event
      levels:
      - question: 你看到的是已经执行后的物理策略，还是只有一个提示或计划标签？
        guidance: 分别查看两份真实执行计划中的连接算子，不把函数名当作执行证据。
        reflection: 一个提示存在，不代表优化器最终一定采用它。
      - question: 两份结果使用的连接算子是否真的不同？
        guidance: 核查各自计划中的实际算子，并留意自适应执行对计划的改变。
        reflection: 仅关闭一个阈值不能替代对最终执行计划的检查。
      - question: 若两份计划都显示同一种连接算子，你能确认策略对比成立吗？
        guidance: 先保留相同结果约束，再检查每一份作业的策略提示与实际算子。
        reflection: 本题验证策略与正确性，不把小数据计时当作普遍性能结论。
    session_side_effect:
      summary: 可能修改了不应改变的全局 Spark 会话配置
      evidenceRequirements:
        anyOf:
        - task
        - event
      levels:
      - question: 这次练习要求影响当前连接，还是改变之后所有作业？
        guidance: 对照运行前后的全局配置，确认题目禁止修改的值保持。
        reflection: 局部策略练习不应给后续课程留下隐式配置变化。
      - question: 退出当前函数后，其他作业会继承你的修改吗？
        guidance: 检查是否使用了会话级修改，而题目只需要当前查询上的策略选择。
        reflection: 恢复配置与避免全局改动的需求需要按任务契约区分。
      - question: 两次运行之间，是否可以只比较当前查询而不改变会话状态？
        guidance: 记录配置前后值，与课程断言一起验证，不用改动全局设置来模拟计划。
        reflection: 不要让第一次调用的副作用影响第二次测试结果。
    uncertain:
      summary: 现有证据不足，先比较预期与实际再提出假设
      evidenceRequirements:
        anyOf:
        - task
        - event
      levels:
      - question: 连接策略对比任务中，哪项实际结果与题目要求不同？
        guidance: 先选最小输入，写出预期输出，再查看当前真实执行结果；没有运行结果就保留未知。
        reflection: 最近输出可能属于旧代码；不能仅凭历史失败断定当前代码仍有同样错误。
      - question: 如何只改变一个条件，区分两个可能原因？
        guidance: 保留其他输入和逻辑，选择一个与题目契约直接相关的边界检查。
        reflection: 一次修改多处会失去定位依据；记录是哪项检查支持或排除了假设。
      - question: 这次检查已经验证了什么，还有什么未知？
        guidance: 将手算或小样例观察与课程原始测试结果分开记录，修复后再提交。
        reflection: 局部样例不等于完整题目通过；不要把代码未报错当作满足任务契约。
- stepId: join-cardinality-lab
  topic: join
  contract: enrich_orders 保留左表所有事实行，包括合法重复、空键和未匹配键；右表每键按 updated_at 与 version 选择确定最新记录；不得对最终结果粗暴去重。
  knowledgeComponents:
  - dataframe.join
  - dataframe.window
  validation:
    kind: course_tests
    guidance: 修改后提交当前练习，使用课程保留的原始断言验证；运行成功、小样例或模型判断不能代替课程通过。
  hypotheses:
    right_key_multiplicity:
      summary: 右表同键的多个版本可能使连接输出行数膨胀
      evidenceRequirements:
        anyOf:
        - task
        - event
      levels:
      - question: 同一个连接键在左右两边分别出现几次？
        guidance: 先数一个键的左表事实行与右表版本行，预测它们会形成多少匹配。
        reflection: 输入中的合法重复事实，与右表多版本造成的扩张需要分开解释。
      - question: 一个左表键匹配到多个右表版本时，每条事实会出现几次？
        guidance: 选一个最小键组，比较预期事实数与实际连接行数，再决定在哪一侧检查版本选择。
        reflection: 不要仅为了行数相等，就删除结果中的所有重复行。
      - question: 两条事实遇到两个版本，普通连接可能产生几条匹配？
        guidance: 画出匹配关系，核对任务要求是否只允许每键的一个确定版本参与。
        reflection: 先定位版本多重性，再验证完整结果与事实保留要求。
    latest_dimension_tie_break:
      summary: 最新版本选择可能缺少时间或版本号的确定顺序
      evidenceRequirements:
        anyOf:
        - task
        - event
      levels:
      - question: 当同键有多条记录时，题目怎样定义最新的一条？
        guidance: 把更新时间和并列时的版本规则分别写出来，再查看当前版本选择。
        reflection: 任意取一条不等于按任务契约选最新版本。
      - question: 同键两条记录更新时间相同时，哪个字段决定胜出？
        guidance: 构造相同时间、不同版本号的局部例子，先预测被选中的记录。
        reflection: 只测试不同时间无法验证并列时的确定性。
      - question: 改变输入顺序以后，按规则选中的版本应改变吗？
        guidance: 对同一组记录改变输入顺序，核查时间和版本号共同定义的顺序是否保持。
        reflection: 结果偶然正确不能证明版本选择具有确定性。
    left_rows_lost:
      summary: 未匹配或空键的左表事实行可能丢失
      evidenceRequirements:
        anyOf:
        - task
        - event
      levels:
      - question: 左表没有匹配版本的事实，是否也必须返回？
        guidance: 分别挑一条未匹配键和一条空键的左表记录，检查输出中是否仍有它们。
        reflection: 补充维度信息与删除事实记录是不同的目标。
      - question: 连接或后续筛选，哪一步可能把未匹配行丢掉？
        guidance: 逐步比较连接前后和后续操作后的事实行数，把丢行定位到一个步骤。
        reflection: 对右侧字段做过滤也可能间接丢掉未匹配事实。
      - question: 一条事实无法补到右侧字段时，原始事实列应该怎样保留？
        guidance: 先手算这条记录的输出，再检查原始列和值是否仍在。
        reflection: 局部保留检查后，还要验证重复事实和最新版本规则。
    output_deduplication:
      summary: 可能通过结果去重掩盖了版本问题或删除合法重复事实
      evidenceRequirements:
        anyOf:
        - task
        - event
      levels:
      - question: 两条内容相同的左表事实，在业务上是否仍是两次独立记录？
        guidance: 先核对任务是否允许删除重复事实，再查看连接后使用的去重操作。
        reflection: 行数减少不一定代表错误已经修复。
      - question: 去掉结果去重后，哪种重复才来自右表版本？
        guidance: 保留一个合法重复事实组，分别核对左表重复与右表版本带来的贡献。
        reflection: 需要解释每个输出行的来源，不能只追求总行数好看。
      - question: 若输入包含两条完全相同的事实，它们应在输出中保留几次？
        guidance: 用这个局部例子验证事实多重性，版本选择问题应在相应来源处理。
        reflection: 不得用结果粗暴去重替代满足任务契约。
    uncertain:
      summary: 现有证据不足，先比较预期与实际再提出假设
      evidenceRequirements:
        anyOf:
        - task
        - event
      levels:
      - question: 事实表与最新版本维度连接任务中，哪项实际结果与题目要求不同？
        guidance: 先选最小输入，写出预期输出，再查看当前真实执行结果；没有运行结果就保留未知。
        reflection: 最近输出可能属于旧代码；不能仅凭历史失败断定当前代码仍有同样错误。
      - question: 如何只改变一个条件，区分两个可能原因？
        guidance: 保留其他输入和逻辑，选择一个与题目契约直接相关的边界检查。
        reflection: 一次修改多处会失去定位依据；记录是哪项检查支持或排除了假设。
      - question: 这次检查已经验证了什么，还有什么未知？
        guidance: 将手算或小样例观察与课程原始测试结果分开记录，修复后再提交。
        reflection: 局部样例不等于完整题目通过；不要把代码未报错当作满足任务契约。
