    ## 先看见一张表，不急着读文件

    接着上一段的 `spark`，可以运行这个完整的小样例：

    ```python
    data = [("CA", "Yellow", 2), ("CA", "Yellow", 4),
            ("CA", "Brown", 3), ("TX", "Yellow", 5)]
    df = spark.createDataFrame(data, ["State", "Color", "Count"])
    df.show()
    ```

    一条元组对应一行，三列分别表示州、颜色、这一批糖果的数量。
    这张表有 **4 条记录**，但共有 **14 颗糖果**。记录条数与业务数量不是同一件事。
    `df.select("State", "Color")` 只选两列；`df.show()` 显示结果，不会修改原表。

