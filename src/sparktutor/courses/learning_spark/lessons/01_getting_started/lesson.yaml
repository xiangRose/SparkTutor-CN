- Class: text
  Id: '7'
  Depth: advanced
  Output: |
    ## 执行模型详解

    当你调用一个 action 时，Spark 的执行引擎启动：

    1. **DAG 调度器** —— 分析转换链并构建有向无环图（DAG）。
       它在 **shuffle 边界**处将 DAG 拆分为多个 stage —— 即数据必须
       在分区之间重新分布的点。

    2. **任务调度器** —— 为每个 stage 创建任务（每个分区一个），
       然后将它们分配给可用的 executor。

    **窄依赖与宽依赖：**
    - **窄依赖**（例如 `map`、`filter`、`select`）—— 每个输入分区
      只被有限的下游分区使用；这些示例不需要 shuffle，但仍可能读取远端数据。
    - **宽依赖**（例如 `groupBy`、`join`、`repartition`）—— 输入分区
      贡献到多个输出分区。需要 **shuffle** —— 代价高昂的网络 I/O。

    **惰性求值：**
    转换会累积成逻辑计划。只有 action 才会触发执行。
    这让 Spark 的 Catalyst 优化器能在生成代码之前分析整个管道并
    重写它 —— 谓词下推、列裁剪、join 重排序 —— 全部透明发生。

