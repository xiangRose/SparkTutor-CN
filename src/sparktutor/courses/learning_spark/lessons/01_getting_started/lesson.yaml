    ## 第三个小操作：排序，然后组合

    继续使用上一小节的汇总结果，按 Total 从大到小排列：

    ```python
    ranked = totals.orderBy(f.col("Total").desc())
    ca_ranked = ranked.filter(f.col("State") == "CA")
    ```

    `desc()` 表示降序；排序改变展示顺序，不会改变每组的 Total。
    四行小样例中，CA 的 Yellow=6 排在 Brown=3 前面。
    最后的综合题换成 CSV 和更大的数量，但计算过程不变。
