    ## 创建 SparkSession：先获得入口

    ```python
    from pyspark.sql import SparkSession

    spark = (SparkSession.builder
        .appName("CandyPreview")
        .master("local[*]")
        .getOrCreate())
    ```

    `appName` 给应用命名；`master("local[*]")` 表示在本机使用可用 CPU 核心；
    `getOrCreate()` 创建或复用会话。这一步先不增加内存、catalog 等配置。
    练习模板中的测试会创建自己的会话；题目接收 `spark` 参数时直接使用，不要再新建或关闭它。

    **文档：** [SparkSession](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.SparkSession.html)。

