- Class: text
  Id: '3'
  Depth: beginner
  Output: |
    ## 类比：主厨与分工协作

    Driver 像主厨，组织应用、准备计算计划并协调任务；Executor 像厨师，执行分配到的任务。
    集群管理器分配计算资源。这个类比只帮助记住职责，不表示 Driver 从不执行计算。
    Driver 还会运行你的 Python 主程序，并接收 `collect()` 等操作返回的结果。

    增加执行器可能提高并行度，也可能增加协调成本；速度取决于数据量、分区和资源，不能只数机器。

- Class: text
  Id: '4'
  Depth: all
  Output: |
    ## 最小架构：你的代码由谁执行？

    - **Driver**：运行应用主程序、建立会话、规划和协调任务。
    - **Executor**：执行数据分区上的任务，并按需要缓存数据。
    - **集群管理器**：在集群部署中为应用分配资源。

    开发时使用 `local[*]`，计算在本机运行，不需要先搭建多台机器。
    这一阶段先分清“本机练习”和“集群运行”，不必背诵调度器内部结构。
    Job、Stage、Task 和 shuffle 的细节会在高级拓展与调优课继续出现。

