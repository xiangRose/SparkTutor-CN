- Class: text
  Id: lazy-actions
  Depth: all
  Output: |
    ## 先描述处理，再请求结果

    `df.select(...)`、`df.filter(...)` 描述如何转换数据，通常只构建计划。
    `show()` 请求展示，`count()` 请求计算行数，才会触发相应计算，这称为 action。
    这种“先规划、后执行”的方式叫惰性求值。

    ```python
    names = df.select("State", "Color")  # 转换：得到一份新计划
    names.show()                        # action：执行并展示
    ```

    本课只对很小的样例查看全部结果；真实大表不要随意 `collect()` 到 Driver。

