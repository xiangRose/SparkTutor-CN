- Class: cmd_question
  Id: '12'
  KnowledgeComponents:
  - dataframe.group_by
  - dataframe.aggregate
  Context: candy_counts
  Depth: all
  Output: |
    给定一个包含 `State`、`Color` 和 `Count` 列的 DataFrame `df`，
    编写代码按 State 和 Color 分组，对 Count 列求和（别名为 "Total"），
    并按总和降序排列。
  CorrectAnswer: |
    from pyspark.sql import functions as f

    result = (df.groupBy("State", "Color")
        .agg(f.sum("Count").alias("Total"))
        .orderBy(f.col("Total").desc()))
  Hint: groupBy 传两列，agg 用 f.sum() 和 alias()，然后 orderBy 用 desc()。

