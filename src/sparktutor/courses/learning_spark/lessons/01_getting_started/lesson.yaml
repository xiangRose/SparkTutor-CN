    ## 再把输入换成 CSV

    有了会话和表的概念，再读取文件。CSV 第一行是列名时设置 `header=True`，
    让 Spark 根据内容推断数值类型时设置 `inferSchema=True`：

    ```python
    df = spark.read.csv(file_path, header=True, inferSchema=True)
    df.show()
    df.printSchema()
    ```

    `file_path` 由综合题测试传入；不要照抄一个本机不存在的路径。
    看 `printSchema()` 确认 Count 是数值列，再对它求和。
    下一课会学习显式声明类型，数据源课再比较不同文件格式。

