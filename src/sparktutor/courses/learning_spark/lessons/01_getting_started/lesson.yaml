- Class: text
  Id: sum-before-grouping
  Depth: all
  Output: |
    ## 第二个小操作：先确定一组应该得到什么

    两条 CA/Yellow 记录的 Count 是 2 和 4，**总数量是 6**，记录条数是 2。
    `groupBy("State", "Color")` 指定哪些行属于同一组，`agg` 指定每组如何计算：

    ```python
    totals = df.groupBy("State", "Color").agg(f.sum("Count").alias("Total"))
    ```

    四行样例会得到 CA/Yellow/6、CA/Brown/3、TX/Yellow/5 三组。
    `alias("Total")` 为结果列命名；此时尚未排序。
    若改用 `count()`，得到的是每组记录条数，回答的是另一个问题。

