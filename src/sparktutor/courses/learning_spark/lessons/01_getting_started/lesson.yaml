- Class: text
  Id: '2'
  Depth: all
  Output: |
    ## 什么是 Spark，什么时候需要它？

    Apache Spark 是处理结构化数据等工作负载的统一分析引擎。
    PySpark 是它的 Python 接口；你写 Python，Spark 引擎规划并执行分布式计算。

    当数据量或处理时间超出单机方案的承受范围、或者已有集群需要协作处理很多数据时，
    Spark 是值得考虑的工具。只有几百行的小表，用 Python、pandas 或数据库通常更直接。
    Spark 有启动、调度和数据交换成本，并不保证数据越小也越快。

    本课先在本机运行。程序结构和基本 API 可以迁移到集群，但分布式性能仍需另外测量。
    Spark 可以缓存复用的数据以减少重复计算；它也会使用磁盘，不会自动把所有数据都放进内存。

