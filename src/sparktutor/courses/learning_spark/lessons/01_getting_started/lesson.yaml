    ## 你将学到什么

    这一课面向会写基础 Python、第一次接触 Spark 的学习者。
    用一个小问题开始：同一种颜色的糖果分多批记录，如何算出每个州的总数量？

    分三段完成，每段结束都可以暂停并保留进度：
    1. **认识工具**：知道什么时候需要 Spark，创建 SparkSession，看懂一张 DataFrame。
    2. **逐项练习**：先筛选行，再区分计数与求和，最后给汇总结果排序。
    3. **独立应用**：把 CSV 读取、分组求和、排序和筛选连成一个函数。

    先用几行数据检查思路，之后再讨论大规模处理；小样例用于理解结果，不用于证明 Spark 更快。

