  Output: |
    ## 练习：优化数据管道

    实现 `optimize_pipeline(spark)`，演示缓存策略和分区管理：

    1. 将 shuffle 分区数设置为 8（用于本练习）
    2. 使用 generate_data() 创建一个包含 10000 行的示例销售 DataFrame
    3. 按 department 和 region 聚合 revenue 的总和、均值及交易数，并缓存结果
    4. 复用缓存的结果进行两次独立分析
    5. 释放缓存
    6. 将 top_dept 输出 coalesce 为 1 个分区
    7. 返回结果
    **输入、输出与通过条件**

    输入：`optimize_pipeline(spark)` 使用给定 generate_data() 和 SCHEMA（10000 行）。
    按 department、region 分组，保留 total_revenue、avg_revenue、sale_count；缓存并触发计算。
    返回字典键：top_dept（department、dept_revenue，五部门按总营收降序）、
    top_region（region、region_avg_revenue，四区域按每笔交易平均营收降序）、
    agg_partitions（聚合结果实际分区数；AQE 可能改变它，不要求恰好等于 8）。
    区域均值应为 sum(total_revenue)/sum(sale_count)，不能对不同大小组的均值简单平均。
    在释放缓存前对两项分析执行 action；将 top_dept 合并为 1 个分区。
    通过条件：两份汇总与原始数据独立计算一致，top_dept 为 1 个分区，分区数是正整数。

    请保留 starter 的函数名和测试区，在真实 Spark 环境运行全部断言；只通过语法检查不算完成。
  StarterFile: starter.py
  SolutionFile: solution.py
  Hint: "用 spark.conf.set 设置 shuffle 分区，.cache() + .count() 来物化，返回前用 .coalesce()。"

- Class: text
  Id: '15'
  Depth: all
  Output: |
    ## 小结

    本课你学到了：

    - **关键配置** —— `shuffle.partitions`、执行器/驱动程序内存和
      文件分区大小是影响最大的设置
    - **repartition 与 coalesce** —— repartition 用于增加或均衡分区；
      coalesce 用于不 shuffle 地减少分区
    - **缓存** —— 对重算代价高且会复用的 DataFrame 评估缓存；不用时 unpersist
    - **存储级别** —— MEMORY_AND_DISK_DESER 是安全的默认值；
      通过 persist 选择适合工作负载的可用级别
    - **调优流程** —— Spark UI → 倾斜 → shuffle → 分区 → 缓存

    你现在拥有了诊断和修复性能问题的工具。在下一课中，你将攻克
    **join** —— 分布式数据处理中最昂贵也最重要的操作。
