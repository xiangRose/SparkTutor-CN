- Class: text
  Id: "7"
  Depth: all
  Output: |
    ## 缓存与持久化

    当一个 DataFrame 在应用中被**多次使用**时，
    缓存可以避免每次都从头重新计算：

    ```python
    df.cache()      # shorthand for persist(MEMORY_AND_DISK_DESER)
    df.count()      # triggers caching (cache is lazy!)
    # ... use df multiple times ...
    df.unpersist()  # release memory when done
    ```

    缓存是**惰性的** —— 调用 `cache()` 只是标记 DataFrame。
    实际数据在 cache() 之后的第一个 action 时才物化。

    **文档：**
    [cache](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.cache.html) |
    [persist](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.persist.html) |
    [unpersist](https://spark.apache.org/docs/4.1.1/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.unpersist.html)
    —— `persist()` 的 `StorageLevel` 参数、惰性物化行为。

- Class: text
  Id: '8'
  Depth: all
  Output: |
    ## 存储级别

    `cache()` 默认使用 `MEMORY_AND_DISK_DESER`。`persist()` 给你更多控制权：

    | 级别 | 存储位置 | 权衡 |
    |------|----------|------|
    | `MEMORY_ONLY` | 内存 | 放不下的分区可能需要重算 |
    | `MEMORY_AND_DISK_DESER` | 内存 + 磁盘 | DataFrame 默认级别 |
    | `DISK_ONLY` | 磁盘 | 减少缓存内存占用，增加磁盘访问 |
    | `OFF_HEAP` | Tungsten 内存 | 不受 JVM GC 管理 |

    ```python
    from pyspark import StorageLevel
    df.persist(StorageLevel.DISK_ONLY)
    ```

    DataFrame 的 `cache()` 默认级别是 `MEMORY_AND_DISK_DESER`。
    根据复用次数、内存容量和重算成本选择是否缓存；PySpark 不提供 `MEMORY_ONLY_SER` 常量。

