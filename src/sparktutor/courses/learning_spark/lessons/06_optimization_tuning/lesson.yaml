    ## 本课路线：先看懂，再动手

    **开始前**：能读 explain 中的过滤和聚合，知道 transformation 与 action。

    **完成后能做什么**：说明缓存和分区的用途，正确物化、复用并释放练习中的缓存。

    先确定瓶颈与测量对象 → 分区 → 缓存生命周期 → 小样例检查 → 综合练习。

    初级、中级、高级都学习综合题必需的知识并完成核心小练习；
    专属内容用于补充类比或拓展原理，不代替核心练习。
    时间包含阅读、编码和调试，可分几次完成；遇到困难先回看对应小节，再使用提示。

- Class: text
  Id: '2'
  Depth: beginner
  Output: |
    把 Spark 分区想象成高速公路上的车道。适当的车道数（分区数）
    让更多的车辆（任务）并行行驶，但车道过多会浪费空间并产生合并开销。
    目标是让分区数量与集群容量和数据规模相匹配。

    调优 Spark 就是在并行度、内存使用和 shuffle 开销之间
    找到恰当的平衡。

- Class: text
  Id: measure-before-tuning
