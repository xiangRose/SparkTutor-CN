- Class: text
  Id: "12"
  Depth: advanced
  Output: |
    ## 系统化的调优方法

    当 Spark 作业运行缓慢时，遵循以下诊断流程：

    **1. 查看 Spark UI** —— 查看 stage 时间线、任务时长和 shuffle 大小。
    UI 能揭示代码无法发现的瓶颈。

    **2. 查找数据倾斜** —— 某些任务明显较慢可能与分区数据量不均有关；
    也应排查 I/O、GC 和机器负载。确认倾斜后，解决方案：加盐（salting）、AQE 倾斜 join，
    或按更好的键重新分区。

    **3. 检查 shuffle 大小** —— 大的 shuffle（每个任务 >1GB）表明
    分区太少或缺少 broadcast 机会。

    **4. 检查分区数量** —— `df.rdd.getNumPartitions()`。
    目标是每个分区约 128MB。太少 = 核心利用不足。
    太多 = 调度开销。

    **5. 检查不必要的计算** —— 同一个 DataFrame 是否被多次重新计算？
    缓存它。你是否在读取不需要的列？尽早使用 `select()`。

- Class: text
  Id: '13'
  Depth: advanced
  Output: |
    ## 监控缓存使用情况

    Spark UI 中的 **Storage 标签页**显示缓存了什么、使用了多少内存
    以及缓存比例。缓存比例不足可能是尚未计算全部分区，也可能与存储容量有关；
    应结合内存/磁盘占用与任务指标判断，不能仅凭比例认定发生了溢写。

    **实用提示**：缓存*过滤后*的 DataFrame，而不是原始读取。
    如果下游只复用过滤聚合后的结果，它通常比完整原始表更值得优先评估。
    是否缓存仍要结合复用次数、重算成本和可用资源测量，不能仅凭数据量判断。

- Class: text
  Id: cache-lifecycle-example
  Depth: all
  Output: |
    ## 综合题前：把缓存生命周期走一遍

    ```python
    cached = df.groupBy("department").agg(f.sum("revenue").alias("total"))
    cached.cache()          # 声明要缓存
    cached.count()          # action，计算并物化缓存
    # 在这里复用 cached 做不同分析
    cached.unpersist()      # 不再需要时释放
    ```

    练习返回的分析结果在释放缓存后仍能重新计算；如果要保存加速收益，应在释放前执行需要的 action。
    coalesce(1) 只用于本题很小的最终结果，不应照搬到所有大数据输出。

