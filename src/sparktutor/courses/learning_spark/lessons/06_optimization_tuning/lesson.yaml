    ## 你将学到什么

    在上一课中，你学习了 Catalyst 优化器的工作原理以及如何阅读执行计划。
    现在你将把这些知识应用到 **调优** Spark 应用上，以获得真实世界的性能表现。

    学完本课后，你将能够：

    - 配置影响最大的 Spark 设置
    - 使用 `repartition` 和 `coalesce` 管理分区
    - 有策略地缓存 DataFrame，并知道何时**不要**缓存
    - 阅读执行计划以诊断性能瓶颈
    - 运用系统化的 Spark 调优方法

