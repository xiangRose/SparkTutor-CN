- Class: text
  Id: "8"
  Depth: all
  Output: |
    ## 无状态与有状态转换

    **无状态** —— 逐行操作，不依赖历史：`select`、`filter`、
    `withColumn`、`flatMap`。这些适用于所有输出模式，
    无需特殊配置。

    **有状态** —— 在微批之间维护状态：`groupBy` 聚合、
    窗口聚合、流-流 join、`dropDuplicates`。这些需要状态管理，
    并可能限制输出模式。

    这种区分很重要，因为有状态操作会累积内存。如果没有界限
    （如水位线），状态可能无限增长。

- Class: text
  Id: "9"
  Depth: intermediate
  Output: |
    ## 触发器

    触发器控制 Spark 多久检查一次新数据：

    ```python
    # Process every 10 seconds
    .trigger(processingTime="10 seconds")

    # Process all available data in one batch, then stop
    .trigger(availableNow=True)

    # Process one micro-batch, then stop (for testing)
    .trigger(once=True)

    # Default: process as fast as possible
    # (no trigger specified)
    ```

    `availableNow` 对于衔接批处理和流处理特别有用 ——
    按计划运行（例如通过 cron 每小时一次）来处理积累的数据。

- Class: text
  Id: "10"
  Depth: all
  Output: |
    ## 窗口聚合

    将事件按时间窗口分组：

    ```python
    from pyspark.sql.functions import window

    # Tumbling windows (non-overlapping, 10-minute buckets)
    windowed = (events
        .groupBy(window("event_time", "10 minutes"))
        .count())

    # Sliding windows (10-minute windows, sliding every 5 minutes)
    windowed = (events
        .groupBy(window("event_time", "10 minutes", "5 minutes"))
        .count())
    ```

    滚动窗口将时间划分为不重叠的桶。滑动窗口会重叠，
    因此每个事件出现在多个窗口中。

- Class: text
  Id: '12'
  Depth: all
  Output: |
    ## 水位线：基于事件时间管理状态

    事件时间是业务事件发生的时间，不一定等于服务收到它的时间。

    ```python
    result = (events
        .withWatermark("event_time", "10 minutes")
        .groupBy(f.window("event_time", "5 minutes"))
        .count())
    ```

    对满足水位线聚合条件的查询，Spark 跟踪事件时间进展，用延迟阈值帮助判断哪些旧窗口可以清理。
    阈值内迟到的数据有不被丢弃的保证；比阈值更晚的数据可能被处理，也可能被丢弃，不能承诺恰好到点一律丢弃。
    状态能否清理还取决于查询、输出模式、窗口和水位线列等条件，它不是固定等待十分钟的墙上时钟。
    本课批处理模拟不验证这些流式运行保证。
    **文档：** [水位线语义](https://spark.apache.org/docs/4.1.1/streaming/apis-on-dataframes-and-datasets.html)。

