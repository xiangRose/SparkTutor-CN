    ## 写入流

    用 `df.writeStream` 替换 `df.write`：

    ```python
    query = (result_df.writeStream
        .outputMode("complete")
        .format("console")
        .trigger(processingTime="10 seconds")
        .start())

    query.awaitTermination()  # blocks until the stream is stopped
    ```

    `start()` 返回一个 `StreamingQuery` 对象，你可以用它来监控
    和停止流。

- Class: text
  Id: "6"
  Depth: all
  Output: |
    ## 输出模式

    输出模式决定每次触发器向 sink 写入**什么**：

    **`append`** —— 自上次触发器以来的新行。用于无状态转换
    （select、filter、map）或基于水位线的聚合之后。

    **`update`** —— 自上次触发器以来发生变化的行。适合
    你只关心最新值的聚合。

    **`complete`** —— 每次触发器输出整个结果表。
    没有水位线的聚合必须使用此模式。大结果集可能代价高昂。

    并非所有模式都适用于所有操作。聚合需要 `complete` 或 `update`。
    无状态转换支持全部三种模式。

