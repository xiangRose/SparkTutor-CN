- Class: cmd_question
  Id: '13'
  KnowledgeComponents:
  - spark.streaming
  Context: socket_word_counts
  Depth: all
  Output: |
    从 localhost:9999 的 socket 源创建流式词频统计。
    将行拆分成单词，按单词分组计数，以 complete 模式写入控制台。

    这是外部 socket API 的短代码练习，运行时需先启动发送端；它不是网页内置的词频数据源。下面的综合题使用自带有限数据，不依赖该服务。
  CorrectAnswer: |
    from pyspark.sql import functions as f

    lines = (spark.readStream
        .format("socket")
        .option("host", "localhost")
        .option("port", 9999)
        .load())

    words = lines.select(f.explode(f.split("value", " ")).alias("word"))

    counts = words.groupBy("word").count()

    query = (counts.writeStream
        .outputMode("complete")
        .format("console")
        .start())
  Hint: readStream 用 socket 格式，split 和 explode 拆词，groupBy + count，writeStream 用 complete 模式。

- Class: text
  Id: "14"
  Depth: advanced
  Output: |
    ## 流-流与流-静态 Join

    **流-静态 join** —— 将流式 DataFrame 与批处理 DataFrame join。
    静态侧每个微批都会重新读取。适用于数据丰富化
    （例如将点击事件与产品目录 join）：

    ```python
    enriched = click_stream.join(product_catalog, "product_id")
    ```

    **流-流 join** —— 两侧都是流。需要水位线来限制状态。
    Spark 缓冲两侧的行并在它们到达时进行匹配：

    ```python
    clicks = clicks.withWatermark("click_time", "10 minutes")
    impressions = impressions.withWatermark("imp_time", "10 minutes")

    matched = clicks.join(impressions,
        expr("click_id = imp_id AND click_time BETWEEN imp_time AND imp_time + interval 5 minutes"))
    ```

- Class: text
  Id: "15"
  Depth: advanced
  Output: |
    ## 容错：Checkpoint

    Structured Streaming 使用 **checkpoint** 实现恰好一次处理。
    在 writeStream 中设置 checkpoint 位置：

    ```python
    query = (result.writeStream
        .outputMode("update")
        .option("checkpointLocation", "/checkpoints/my_query")
        .format("parquet")
        .start("/output/data"))
    ```

    重启时，Spark 从 checkpoint 重放以恢复状态。两条规则要记住：
    1. 重启之间不要在不清除 checkpoint 的情况下更改查询逻辑
    2. 不要在不同查询之间共享 checkpoint 位置

- Class: text
  Id: streaming-window-check-example
  Depth: all
  Output: |
    ## 先手算一个小窗口

    窗口以时间区间表示，例如 [10:00, 10:05) 包含 10:00，不包含 10:05。
    10:01 和 10:04 的事件落在这个窗口，10:05 落入下一个不重叠窗口。
    Spark 的 window 函数可用于批 DataFrame，验证分组变换；这不会自动验证真实流的状态清理。
    水位线是事件时间进展与状态管理机制，不能简单解释为“固定等几分钟再接收所有数据”。

