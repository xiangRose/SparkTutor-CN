    ## 本课路线：先看懂，再动手

    **开始前**：会对静态 DataFrame 进行分组聚合；理解 action 和运行中的作业。

    **完成后能做什么**：解释无界输入和状态；用本地批处理练习验证核心变换，并识别模拟边界。

    静态与持续输入对照 → 读取与写出 → 状态和时间窗口 → 水位线 → 批处理模拟练习。

    初级、中级、高级都学习综合题必需的知识并完成核心小练习；
    专属内容用于补充类比或拓展原理，不代替核心练习。
    时间包含阅读、编码和调试，可分几次完成；遇到困难先回看对应小节，再使用提示。

- Class: text
