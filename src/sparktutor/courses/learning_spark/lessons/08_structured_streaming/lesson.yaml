    ## 你将学到什么

    到目前为止，我们做的都是**批处理** —— 读取完整数据集，
    转换它，写出结果。但真实数据通常是持续到达的：用户点击、
    传感器读数、交易事件。

    Structured Streaming 让你在数据到达时就处理它，
    而且使用的是你已经熟悉的 DataFrame API。

    本课分为概念阅读和本地练习两个部分：

    - **能解释与识别**：无界表模型、数据源与数据汇、输出模式、触发器、水位线和 checkpoint 的用途。
    - **能动手完成**：对有限 DataFrame 做词频统计和时间窗口变换，检查预期结果。

    阅读中的 Kafka、socket 和持续流 API 是后续实验参考；本课综合题不运行这些服务，
    也不验证迟到数据处理、checkpoint 恢复或端到端容错。实际部署还需单独准备环境并测试。

