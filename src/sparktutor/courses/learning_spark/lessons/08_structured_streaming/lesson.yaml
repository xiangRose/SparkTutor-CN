  Output: |
    ## 先区分：理解流处理，与验证流系统

    静态文件是“处理这批已有数据”；流处理是“新数据到来后，继续更新结果”。
    本课阅读会展示 readStream/writeStream，但综合题只对有限 DataFrame 做词频和时间窗口变换。
    它不连接 Kafka、不启动真实持续流，也不验证 checkpoint 恢复、迟到数据清理或端到端 exactly-once。
    先把变换算对，再用独立的流式实验验证运行语义，不能拿模拟测试代替后者。

- Class: text
  Id: "3"
  Depth: all
  Output: |
    ## 流式模型

    Structured Streaming 将实时数据流视为一张**持续追加的表**。
    新数据到达就像向一张无界输入表追加新行。你的查询在这张表上
    增量运行，在输出表中产生结果。

    核心组件：

    - **Source（数据源）** —— 数据从哪里来：文件、Kafka、socket、
      rate（合成数据）
    - **Query（查询）** —— 你的 DataFrame 转换（与批处理相同的 API）
    - **Sink（数据汇）** —— 结果写到哪里：文件、Kafka、控制台、
      内存、foreach
    - **Trigger（触发器）** —— 多久检查一次新数据
    - **Output mode（输出模式）** —— 每次触发器向 sink 写入什么

- Class: text
  Id: "4"
  Depth: all
  Output: |
    ## 读取流

    用 `spark.readStream` 替换 `spark.read`：

    ```python
    # File source — picks up new files as they appear
    stream_df = (spark.readStream
        .format("csv")
        .option("header", "true")
        .schema(my_schema)       # required for streaming!
        .load("/data/incoming/"))

    # Socket source — for development/testing
    lines = (spark.readStream
        .format("socket")
        .option("host", "localhost")
        .option("port", 9999)
        .load())
    ```

    **重要**：流式数据源**必须**显式指定 schema。
    `inferSchema` 不可用，因为没有完整的数据集可供采样。

    **文档：** [Structured Streaming Programming Guide](https://spark.apache.org/docs/4.1.1/structured-streaming-programming-guide.html)
    —— 数据源、数据汇、输出模式、触发器、水位线、容错，
    以及流-流 join，均有完整代码示例。

- Class: text
