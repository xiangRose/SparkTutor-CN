<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · SparkTutor</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/appearance.css"><link rel="stylesheet" href="/account.css"><script src="/appearance.js"></script><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-shell"><section class="login-story"><a href="/" class="login-brand">✧ SparkTutor</a><span class="eyebrow">YOUR OWN LEARNING JOURNEY</span><h1>每一步进步，<br>都为你留住。</h1><p>从一行 PySpark，到完整的数据管道。<br>登录你的学习空间，接着上次的探索。</p><div class="login-benefits"><span>01 · 专属课程进度</span><span>02 · 自动保存代码</span><span>03 · 回顾学习足迹</span></div></section><section class="panel login-card" aria-labelledby="login-title"><div class="login-tabs" role="tablist" aria-label="账号入口"><button id="login-tab" role="tab" aria-selected="true" data-mode="login">登录</button><button id="register-tab" role="tab" aria-selected="false" data-mode="register">注册账号</button></div><h2 id="login-title">欢迎回来</h2><p id="login-intro">你的课程进度与练习代码，已为你留好位置。</p><form id="login-form" data-mode="login"><div class="field" id="display-name-field" hidden><label for="display-name">学习昵称</label><input id="display-name" maxlength="40" autocomplete="nickname" placeholder="在这里怎么称呼你"></div><div class="field"><label for="username">账号</label><input id="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" autocomplete="username" placeholder="英文字母、数字或下划线"><small>3–32 位，账号不区分大小写。</small></div><div class="field"><label for="password">密码</label><input id="password" type="password" required maxlength="128" autocomplete="current-password" placeholder="输入你的密码"></div><div class="field" id="confirm-field" hidden><label for="confirm-password">确认密码</label><input id="confirm-password" type="password" maxlength="128" autocomplete="new-password" placeholder="再输入一次密码"></div><p id="login-message" class="account-message" role="status" aria-live="polite"></p><button type="submit" class="btn primary login-submit" id="login-submit">登录学习空间 →</button></form><p class="login-note">每个账号的进度、历史和代码分别保存。忘记密码时，请联系管理员重置。</p></section></main></body></html>
