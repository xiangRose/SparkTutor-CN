<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5eee1">
  <title>登录 · SparkTutor</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <header class="login-header">
      <a href="/" class="login-brand" aria-label="SparkTutor 首页"><span aria-hidden="true">✦</span><strong>SparkTutor</strong></a>
      <span class="login-header-note">把知识，变成实践。</span>
    </header>
    <div class="login-main">
      <div class="login-content">
        <div class="login-introduction">
          <span class="eyebrow">SPARKTUTOR · PYSPARK LEARNING</span>
          <h1>从好奇出发，<br><em>向实践生长。</em></h1>
          <p>沿着自己的节奏探索 PySpark。<br>课程、练习与 AI 导师，陪你把每一步走扎实。</p>
        </div>
        <section class="login-card" aria-labelledby="login-title">
          <div class="login-card-header">
            <div><span class="login-card-kicker">YOUR LEARNING SPACE</span><h2 id="login-title">欢迎回来</h2></div>
            <span class="login-card-mark" aria-hidden="true">✦</span>
          </div>
          <p id="login-intro" class="login-intro">继续上次的探索，接着写下你的答案。</p>
          <div class="login-tabs" role="tablist" aria-label="账号入口">
            <button id="login-tab" type="button" role="tab" aria-selected="true" data-mode="login">登录</button>
            <button id="register-tab" type="button" role="tab" aria-selected="false" data-mode="register">注册账号</button>
          </div>
          <form id="login-form" data-mode="login">
            <div class="field" id="display-name-field" hidden><label for="display-name">学习昵称</label><input id="display-name" maxlength="40" autocomplete="nickname" placeholder="希望我们怎么称呼你"></div>
            <div class="field"><label for="username">账号</label><input id="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" autocomplete="username" placeholder="请输入账号"><small>3–32 位英文字母、数字或下划线</small></div>
            <div class="field"><label for="password">密码</label><input id="password" type="password" required maxlength="128" autocomplete="current-password" placeholder="请输入密码"></div>
            <div class="field" id="confirm-field" hidden><label for="confirm-password">确认密码</label><input id="confirm-password" type="password" maxlength="128" autocomplete="new-password" placeholder="再输入一次密码"></div>
            <p id="login-message" class="account-message" role="status" aria-live="polite"></p>
            <button type="submit" class="login-submit" id="login-submit">进入学习空间 <span aria-hidden="true">→</span></button>
          </form>
          <p class="login-note">忘记密码？请联系管理员重置。</p>
        </section>
      </div>
    </div>
    <footer class="login-footer"><span>从一行代码开始，走向更远的地方。</span><span>LEARN · BUILD · GROW</span></footer>
  </main>
</body>
</html>
